name: Deploy Frontend
on:
  push:
    branches: [main]
    paths: ["frontend/**", "shared/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:frontend
      # Vercel deployment would go here with secrets
